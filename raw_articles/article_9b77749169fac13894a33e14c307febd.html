<h3 dir="auto">Build More Pipelines and a Strategic Petroleum Reserve: Lessons from Decades of Vulnerability</h3>
<p><strong><a href="https://substack.com/@thenemethreport" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/@thenemethreport&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw1Rhx4gD4V5_xa25sOYahOR">The Nemeth Report</a></strong></p>
<h4 class="entry-title">Also See the Special Feature by Tammy Nemeth –&nbsp;<a href="https://energynow.ca/2026/03/coming-in-april-canadas-energy-history-in-bite-sized-episodes-see-the-first-teaser-episode-of-3-minute-history-canada-here/" target="_blank" rel="noopener noreferrer">Canada’s Energy History in Bite-Sized Episodes – See the First “Teaser” Episode of 3 MINUTE HISTORY CANADA Here</a></h4>
<div class="g g-15">
<div class="g-dyn a-800 c-1">
<hr>
<p><strong>Get the Latest Canadian Focused Energy News Delivered to You! It’s FREE:&nbsp;<a class="gofollow" href="https://energynow.com/email-signup/?__hstc=22611695.1f97008328ffa3a817435a0b359a1be5.1699040414203.1773677759231.1773681651527.843&amp;__hssc=22611695.2.1773681651527&amp;__hsfp=5bb0b5e9ddb26c88ae4cf5a486346450" target="_blank" rel="noopener noreferrer" data-track="ODAwLDE1LDM2MDA=">Quick Sign-Up Here</a></strong></p>
<hr>
</div>
</div>
<h2><strong>Canada is unable to reliably assist its allies in a time of global oil crisis</strong>, lacking a Strategic Petroleum Reserve or sufficient pipeline capacity to move surge production and contribute meaningfully to shared emergency supplies.</h2>
<p>In the midst of the 2026 U.S.-Israeli conflict with Iran, global oil prices have surged amid supply shocks, prompting the International Energy Agency (IEA) to orchestrate its largest-ever release of 400 million barrels from emergency reserves. Yet Canada, the world’s fourth-largest oil producer and a founding IEA member, finds itself scrambling. <strong>Without a national Strategic Petroleum Reserve (SPR), the government is&nbsp;<a href="https://substack.com/redirect/c30bc78b-e07d-4a1a-9a84-226a685e7831?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/c30bc78b-e07d-4a1a-9a84-226a685e7831?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw3lZmQIGpLF5uQC7yxHV_Hs">reduced</a>&nbsp;to pleading with private oil companies to release commercial inventories and delay oil sands maintenance to&nbsp;<a href="https://substack.com/redirect/d241475b-b80e-4967-87d7-ae520da70f4e?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/d241475b-b80e-4967-87d7-ae520da70f4e?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw0HeNM1pwkTSo3jPsFsb-0d">boost short-term output</a>. Even then, the slight increase in supplies is limited in effectiveness by lack of excess pipeline capacity.</strong> This ad-hoc response underscores a glaring vulnerability:&nbsp;<strong>Canada is unable to reliably assist its allies in a time of global oil crisis</strong>, lacking a Strategic Petroleum Reserve or sufficient pipeline capacity to move surge production and contribute meaningfully to shared emergency supplies. It is time for a real energy security strategy—one that learns from half a century of complacency and builds resilience against an unstable world.</p>
<p>Canada’s exemption from the IEA’s 90-day oil stockpile requirement dates back to 1974, when the agency was formed in response to the Arab oil embargo. As an emerging net exporter, buoyed by Alberta’s growing production and prospects of Atlantic offshore developments, Canada&nbsp;<a href="https://substack.com/redirect/bcf08c0b-70b1-44e4-a00b-6dceefb2a6b3?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/bcf08c0b-70b1-44e4-a00b-6dceefb2a6b3?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw3f_-_LI9s9IqRfUXMSwVCG">negotiated an opt-out</a>, arguing that ample spare pipeline capacity could enable emergency production surges to meet oil-sharing obligations under the IEA’s International Energy Program. This assumption held in the 1980s and 1990s, when infrastructure like the Interprovincial Pipeline had 20-30 per cent excess capacity, allowing quick ramps in output from the Western Canada Sedimentary Basin. Key players, including the Department of Energy, Mines and Resources and the National Energy Board,&nbsp;<a href="https://substack.com/redirect/bcfda83c-ae7a-4026-b9fe-8b8280eb9590?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/bcfda83c-ae7a-4026-b9fe-8b8280eb9590?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw19YQsDK7Ee5fMFigVgqzS_">projected this flexibility</a>&nbsp;into the foreseeable future, prioritizing production over costly storage.</p>
<p>But that spare capacity has vanished. Starting in the mid-2010s, bottlenecks emerged as production outpaced infrastructure. Projects like Keystone XL were delayed for years by regulatory hurdles and ultimately canceled in 2021, while the Trans Mountain Expansion (TMX) faced endless reviews, finally completing in 2024 after a decade of setbacks and eventual government purchase of the asset. These delays, spanning over 15 years, were&nbsp;<a href="https://substack.com/redirect/7ea546e6-4d07-4405-b6d5-21cd174de5f5?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/7ea546e6-4d07-4405-b6d5-21cd174de5f5?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw1KIKv5ZRAcS5dCVjnGP1W2">driven</a> largely by environmental and climate activists, whose protests, lawsuits, and blockades—such as the 2019 rail disruptions that caused propane shortages in Quebec and Atlantic Canada—highlighted how fragile Canada’s logistics are and how redundancies are necessary.</p><div class="today-7b50a728ebcff07f10de56e329b78c05 today-rd-leaderboard-in-story-middle" id="today-7b50a728ebcff07f10de56e329b78c05"></div>
<p>Compounding this, Canada has long dodged the expense of an SPR, estimated at billions for infrastructure like underground salt caverns. In 1977-1978 and in 1981, under Prime Minister Pierre Trudeau, officials floated a collaborative idea to the U.S.: Build part of their SPR in Canada in exchange for increased oil exports to the U.S. Midwest. Two different U.S. Energy Secretaries&nbsp;<a href="https://substack.com/redirect/1585a934-d92b-4fc3-a5bf-3dd46e78ae71?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/1585a934-d92b-4fc3-a5bf-3dd46e78ae71?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw0lt09bYK3sAJ5EFaq7fK_c">rebuffed</a>&nbsp;the idea, not wanting to build part of the vital reserve in another country—not even Canada. The U.S. went on to amass an 800-million-barrel SPR, while Canada leaned on its exporter status, leaving Eastern Canada—import-dependent and storage-poor—to rely on American tanks.&nbsp;<a href="https://substack.com/redirect/4d4c4515-56b5-4a7b-ae87-41c1f7ae475c?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/4d4c4515-56b5-4a7b-ae87-41c1f7ae475c?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw0FAJNlQjmUdF4OYOib70P7">Analysts</a>&nbsp;and&nbsp;<a href="https://substack.com/redirect/a1f2149f-9f6c-4c2d-a169-dbbc857e9a4a?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/a1f2149f-9f6c-4c2d-a169-dbbc857e9a4a?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw0nVvMjU4RcOQjnd3PYlYOZ">industry groups</a>&nbsp;have warned that Eastern Canada is exposed to disruptions like rail strikes or geopolitical shocks because it has limited crude oil storage capacity and is increasingly dependent on American and other imports.</p>
<p>This East-West divide persists, but the real irony lies in crisis responses. We’re&nbsp;<a href="https://substack.com/redirect/f99babba-ee46-4c9b-ac1b-a31f31fa5c07?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/f99babba-ee46-4c9b-ac1b-a31f31fa5c07?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw30ngcVDM4cEjibWZvXGriQ">constantly</a>&nbsp;told the world is&nbsp;<a href="https://substack.com/redirect/0c0b00a4-9726-4f37-8295-5c1e9e7a9668?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/0c0b00a4-9726-4f37-8295-5c1e9e7a9668?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw1vPyC3x1ZSN5Lr7J6GGVy7">unstable</a>—pandemics, price wars, invasions—yet every time a shock hits,&nbsp;<a href="https://substack.com/redirect/55c27b2e-db99-49b2-b636-008da3843297?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/55c27b2e-db99-49b2-b636-008da3843297?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw1i3V0FyUqLnpONuBmtaiPR">net zero</a>&nbsp;advocates&nbsp;<a href="https://substack.com/redirect/6b934c80-f0c7-4b7f-a408-b822c1754ef4?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/6b934c80-f0c7-4b7f-a408-b822c1754ef4?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw1uF02kxYHIWcZf5fQyOBLr">dismiss</a>&nbsp;calls for more pipelines or production capacity. During Russia’s 2022 invasion of Ukraine, which spiked global prices, they argued there’s&nbsp;<a href="https://substack.com/redirect/cba6c114-e3d6-41df-9681-e10f7836dd6c?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/cba6c114-e3d6-41df-9681-e10f7836dd6c?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw07Pb4ox2TNhSmu7H4wTGTO">no point</a>: the energy transition is&nbsp;<a href="https://substack.com/redirect/27f9e5f5-a420-4ed7-81a9-a477eb492e78?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/27f9e5f5-a420-4ed7-81a9-a477eb492e78?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw1Q1Yj0X5ZYz1kJyYxupX42">accelerating</a>, and nothing can be&nbsp;<a href="https://substack.com/redirect/80e96296-83a0-4b8e-93a3-bf0f206ce71a?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/80e96296-83a0-4b8e-93a3-bf0f206ce71a?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw3FJ5O3ax7i-t7_JWXRzuTC">built in time</a>&nbsp;anyway. Fast-forward to 2026’s Iran crisis, and the script repeats—Canada taps industry for voluntary surges while the&nbsp;<a href="https://substack.com/redirect/e62f9614-99cd-4763-86b5-998676f9b098?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/e62f9614-99cd-4763-86b5-998676f9b098?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw2G1s3AOK-cigmixNUVyEtW">IEA draws</a>&nbsp;from reserves elsewhere (Canada contributed&nbsp;<em>zero</em>&nbsp;barrels to the 2022 release). But the transition is not accelerating as claimed; renewables are being added, yet oil and natural gas demand&nbsp;<a href="https://substack.com/redirect/bc956262-b893-4526-8475-b9b3e49d816c?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/bc956262-b893-4526-8475-b9b3e49d816c?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031494000&amp;usg=AOvVaw3pT0zMTGn7cq-Cp-cBv4pV">hits records</a>. Why assume there will be no more crises? As&nbsp;<a href="https://substack.com/redirect/1585a934-d92b-4fc3-a5bf-3dd46e78ae71?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/1585a934-d92b-4fc3-a5bf-3dd46e78ae71?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031495000&amp;usg=AOvVaw3gEBScxEuMmjwli3gpAGAJ">Robert Skinner</a>, former Canadian representative to the IEA, aptly put it in 2020, these are “white swans that have been paddling around the pond for a long time”—predictable risks we ignore at our peril.</p>
<p>Canada is the only G7 nation without an SPR, a fact that has drawn renewed scrutiny amid the current turmoil. A 2008 report by Gordon Laxer,&nbsp;<em><a href="https://substack.com/redirect/ab6f0b6b-13ef-441e-808e-9824c84c2f86?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/ab6f0b6b-13ef-441e-808e-9824c84c2f86?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031495000&amp;usg=AOvVaw2w3s0fIQbmCRBPzABUdPrB">Freezing in the Dark,</a></em>&nbsp;proposed using Ontario’s salt caverns for 31 million barrels to shield Eastern Canadians—feasible and cost-effective as well as storage locations in all provinces that are dependent on imported oil. Yet Canada has dithered, favoring&nbsp;<a href="https://substack.com/redirect/f8c31a9b-a417-4108-a386-c9ac7de34532?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/f8c31a9b-a417-4108-a386-c9ac7de34532?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031495000&amp;usg=AOvVaw3nZdaON5pdxZYqJ3cGPHvG">other spending</a>&nbsp;and&nbsp;<a href="https://substack.com/redirect/1794f882-87d4-4887-8cd9-7c3320ad0b03?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/1794f882-87d4-4887-8cd9-7c3320ad0b03?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031495000&amp;usg=AOvVaw207qQCBzMwCyQ6RLiiHI3i">advancing</a>&nbsp;<a href="https://substack.com/redirect/91ca4ec5-0b8e-49d8-ace3-a5a59dadf6f0?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/91ca4ec5-0b8e-49d8-ace3-a5a59dadf6f0?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031495000&amp;usg=AOvVaw1Q6A1S7ZcNgiJcrpO_IU-P">net zero</a>&nbsp;over real energy security. The Iran war could bolster calls for pipelines like another Pacific export route, or extension to the Maritimes, enabling long-term growth. But without action, Canada will remain vulnerable.</p>
<p>It is time for bold steps: Fast-track pipeline expansions to restore surge capacity, and establish a Canadian SPR, perhaps starting with 90 days’ worth for&nbsp;<a href="https://substack.com/redirect/0f119d70-c06e-463e-ac67-e387aee26817?j=eyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw" target="_blank" rel="noopener noreferrer" data-saferedirecturl="https://www.google.com/url?q=https://substack.com/redirect/0f119d70-c06e-463e-ac67-e387aee26817?j%3DeyJ1IjoiMTJ1cXZ0In0.rxDX6jpMgrIJ6DYyZnDHuIjpS1jWv2bcUWUGMdkuaiw&amp;source=gmail&amp;ust=1773591031495000&amp;usg=AOvVaw2aVItOtcJilcfbaZX-LuCW">Eastern imports</a>. In a world where energy underpins everything from food prices to national defence, this is about pragmatic resilience not hydrocarbon favoritism. Energy security is national security. With crises mounting, delay is no longer an option. Let’s strengthen Canada’s energy security before the next white swan strikes.</p>

														<div class="today-4a4106f68f4767a7fa29ec4d81864940 today-rd-in-post-before-content" id="today-4a4106f68f4767a7fa29ec4d81864940"></div><h3><a href="https://energynow.ca/2026/05/commentary-ottawa-should-scrap-offshore-tanker-ban-for-sake-of-canadas-economy-kenneth-green/" target="_blank" rel="noopener noreferrer"><em>From Energy Now</em></a></h3>
<p><strong><a href="https://torontosun.com/author/kenneth-green/" target="_blank" rel="noopener noreferrer">Kenneth Green</a></strong></p>
<h2><em>There never was a legitimate reason for the tanker ban in the first place.</em></h2>
<div class="g g-15">
<div class="g-dyn a-800 c-1">
<hr>
<p><strong>Get the Latest Canadian Focused Energy News Delivered to You! It’s FREE:&nbsp;<a class="gofollow" href="https://energynow.com/email-signup/" target="_blank" rel="noopener noreferrer" data-track="ODAwLDE1LDM2MDA=">Quick Sign-Up Here</a></strong></p>
<hr>
</div>
</div>
<p>On May 26, private member’s Bill C-264 is up for debate in the House of Commons. The bill is short and sweet, with a single proposed action: “The Oil Tanker Moratorium Act, Chapter 26 of the Statutes of Canada, 2019, is repealed.” That’s it; the whole shebang.</p>
<p>Of course, compared to any kind of transport — tankers, pipelines, railways, highways — private members’ bills tend to go nowhere fast. But this bill — to repeal the federal government’s tanker ban — is worthy of greater consideration, given its importance to Canada’s economy.</p>
<p>The biggest reason to repeal the ban is that there was never a legitimate reason for it in the first place. Oil, fuel and large vessels with large fuel tanks have been transiting the waters of northern British Columbia, moving to and from Alaska to the U.S. mainland and points farther south for many decades, with great safety.</p>
<p>As we noted in a study published by the Fraser Institute in 2017 (just a couple of years before the Trudeau government enacted the tanker ban), there has not been a single major spill from oil tankers or other vessels in Canadian waters, east coast or west, since the mid-1990s (and that was a fuel leak, not an oil spill). There have been a few smaller fuel and oil spills, but nothing large or damaging by international standards.</p><div class="today-4eb46fbf4ab8ac2639752d66d0ea8b91 today-rd-leaderboard-in-story-middle" id="today-4eb46fbf4ab8ac2639752d66d0ea8b91"></div>
<p>According to a study by the federal government, a major spill of more than 10,000 tonnes is likely to occur once every 242 years. Likewise, a spill of 100 to 1,000 tonnes is expected to occur once every 69.2 years. And the history of oil transport off Canada’s coasts is one of incredible safety, whether the transport is of Canadian or foreign origin.</p>
<p>That’s why the tanker ban (officially known as Bill C-48) was actually never about environmental protection. It was about stopping pipelines. Back then, the target was the Trans Mountain Expansion pipeline project. Now, it’s a potential million-barrel-per-day pipeline from Alberta to B.C. Indeed, under the&nbsp;<a href="https://www.pm.gc.ca/en/news/backgrounders/2025/11/27/canada-alberta-memorandum-understanding" target="_blank" rel="noopener noreferrer">Memorandum of Understanding (MOU)</a>&nbsp;signed last November by Prime Minister Mark Carney and Alberta Premier Danielle Smith, the new pipeline would allow Canadian oil to be exported to Asia and points west, breaking the buyer’s monopoly currently enjoyed (but increasingly unneeded) by the United States. This is, in theory at least, in line with the prime minister’s stated preference for the diversification of Canadian trade.</p>
<p>So, there was never a good reason to institute the tanker ban, but there’s good reason to kill it. Eliminating one more potential roadblock to a new Alberta-B.C. pipeline would remove one more barrier to potential investors interested in seeing Canada’s oil produced and sold at top-dollar prices on world markets. Lining up those investors is Smith’s greatest challenge in the MOU process.</p>
<p>Bill C-264 is a refreshingly short, targeted piece of proposed legislation, which would remove a superfluous barrier to investment in a new path to Asian oil exports. It would not increase environmental risk; it might let Alberta produce and sell more oil for the benefit of Alberta and all of Canada and it might assist in trade diversification that the prime minister keeps talking about. A win-win-win thing, if there ever was one.</p>
<p><strong><em>Kenneth Green is a senior fellow at the Fraser Institute</em></strong></p>

														<div class="today-6402c3f1eb0a96753874e0e1f5af8f6f today-rd-in-post-before-content" id="today-6402c3f1eb0a96753874e0e1f5af8f6f"></div><h3><a href="https://resourceworks.com/27-proposed-mines-could-generate-818-billion-and-more-than-2-million-jobs-for-canada/" target="_blank" rel="noopener noreferrer"><em>From Resource Works</em></a></h3>
<p><strong>By <a href="https://resourceworks.com/author/ian/" target="_blank" rel="noopener noreferrer"><span class="elementor-icon-list-text elementor-post-info__item elementor-post-info__item--type-author">Ian Biana</span></a></strong></p>
<h2>A new economic impact study puts hard numbers on what BC’s mining pipeline is worth — and what the country loses for every year it sits in permitting limbo.</h2>
<p>A new&nbsp;<a href="https://mining.bc.ca/2025/05/2025-economic-impact-study/" target="_blank" rel="noopener noreferrer">economic impact study</a>&nbsp;from the Mining Association of British Columbia shows that 27 proposed critical mineral, precious metal, and steelmaking coal mines in B.C. could generate a staggering $818 billion in total economic output and support more than 2.2 million jobs across Canada over their operating lives.</p>
<p>The 2025 update, prepared by Mansfield Consulting Inc., assessed 18 critical mineral mines, six precious metal mines, and three steelmaking coal mines, all in advanced stages of development. The numbers are enormous and they deserve to be taken seriously.</p>
<p>During construction alone, the 27 projects would generate $81 billion in total Canadian output, $39 billion in GDP, and support more than 306,000 jobs. Federal tax revenue from construction would reach $5.9 billion. Provincial tax revenue would hit $4.5 billion.</p>
<p>Once operating, the picture scales dramatically. Total Canadian output from mine operations would reach $818 billion. GDP contribution would stand at $411 billion. Total jobs supported across the country would exceed 2.2 million. Federal tax revenue would climb to $68 billion, while provincial tax revenue would hit $82 billion.</p>
<h3 id="h-a-national-economic-asset" class="wp-block-heading"><strong>A national economic asset</strong></h3>
<p>The vast majority of the impact stays in B.C. Approximately 82 per cent of total output and 76 per cent of jobs during operations would be generated within the province. The remaining 18 to 24 per cent flows to other regions of Canada through supply chains, induced spending, and interprovincial economic activity.</p>
<p>These are not B.C.-only projects. They are national economic assets that happen to be located in British Columbia.</p><div class="today-19315bb8305d5a15b18c0ec450f31023 today-rd-leaderboard-in-story-middle" id="today-19315bb8305d5a15b18c0ec450f31023"></div>
<p>The project list reads like a map of B.C.’s mineral future. It includes Galore Creek, KSM, Red Chris, Highland Valley Copper, Eskay Creek, Cariboo Gold, the Wicheeda rare earths project, and Conuma’s steelmaking coal operations, among others. Many involve significant First Nations partnerships and equity arrangements.</p>
<h3 id="h-the-cost-of-permitting-delays" class="wp-block-heading"><strong>The cost of permitting delays</strong></h3>
<p>The study arrives at a moment when B.C.’s mining sector is pushing hard for faster permitting. The Mining Association has been clear that momentum is building, but the province takes years longer than competitors like Australia and Chile to approve new mines.</p>
<p>The Critical Minerals Office is new and underfunded. The PST expansion to engineering and geoscience services has raised costs on every project in the pipeline.</p>
<p>The numbers in this study make the cost of delay painfully concrete. Every year that a project sits in permitting limbo is a year of lost GDP, lost jobs, and lost tax revenue for a province and a country that cannot afford to leave $818 billion on the table.</p>
<p>The 2025 Economic Impact Study was prepared by Mansfield Consulting Inc. for the Mining Association of British Columbia.</p>
