essure and vulnerability whether...\"}],\"$L1f\",\"$L20\",\"$L21\",\"$L22\",\"$L23\",\"$L24\"]\n"])</script><script>self.__next_f.push([1,"25:I[27201,[\"/_next/static/chunks/03u~4v145qiv-.js\",\"/_next/static/chunks/0fd4~ti0cj89w.js\",\"/_next/static/chunks/0_0wyrpdr2qwv.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\",\"/_next/static/chunks/0-of9g6sjew.o.js\",\"/_next/static/chunks/081.11jo8d7_3.js\"],\"IconMark\"]\n1f:[\"$\",\"meta\",\"13\",{\"name\":\"twitter:image\",\"content\":\"https://www.datocms-assets.com/36798/1646150699-gettyimages-463844782.jpg?crop=focalpoint\u0026fit=crop\u0026fp-x=0.25\u0026fp-y=0.46\u0026h=478\u0026w=850\"}]\n20:[\"$\",\"link\",\"14\",{\"rel\":\"shortcut icon\",\"href\":\"/appicons/favicon-32x32.png\"}]\n21:[\"$\",\"link\",\"15\",{\"rel\":\"icon\",\"href\":\"/appicons/favicon-16x16.png\"}]\n22:[\"$\",\"link\",\"16\",{\"rel\":\"apple-touch-icon\",\"href\":\"/appicons/apple-touch-icon.png\"}]\n23:[\"$\",\"link\",\"17\",{\"rel\":\"apple-touch-icon-precomposed\",\"href\":\"/apple-touch-icon-precomposed.png\"}]\n24:[\"$\",\"$L25\",\"18\",{}]\n"])</script><script>self.__next_f.push([1,"26:I[9261,[\"/_next/static/chunks/03u~4v145qiv-.js\",\"/_next/static/chunks/0fd4~ti0cj89w.js\",\"/_next/static/chunks/0_0wyrpdr2qwv.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\",\"/_next/static/chunks/0-of9g6sjew.o.js\",\"/_next/static/chunks/081.11jo8d7_3.js\",\"/_next/static/chunks/0i436g.88kg8q.js\",\"/_next/static/chunks/0jma530wnyhnw.js\",\"/_next/static/chunks/1654x-s9msqp~.js\",\"/_next/static/chunks/0zx5uwhd6m~1k.js\",\"/_next/static/chunks/0ju50~blxg.tu.js\"],\"AvailableRouteTranslations\"]\n27:I[75276,[\"/_next/static/chunks/03u~4v145qiv-.js\",\"/_next/static/chunks/0fd4~ti0cj89w.js\",\"/_next/static/chunks/0_0wyrpdr2qwv.js\",\"/_next/static/chunks/0d3shmwh5_nmn.js\",\"/_next/static/chunks/0-of9g6sjew.o.js\",\"/_next/static/chunks/081.11jo8d7_3.js\",\"/_next/static/chunks/0i436g.88kg8q.js\",\"/_next/static/chunks/0jma530wnyhnw.js\",\"/_next/static/chunks/1654x-s9msqp~.js\",\"/_next/static/chunks/0zx5uwhd6m~1k.js\",\"/_next/static/chunks/0ju50~blxg.tu.js\"],\"default\"]\n28:T47a,\u003cp\u003eThe effective closure of the Strait of Hormuz amid the latest round of war between Iran, Israel and the United States has \u003ca href=\"../en/media-monitor/iraq-pivots-north-as-strait-of-hormuz-closure-forces-rethink-on-oil-flows\" target=\"_blank\" rel=\"noopener\"\u003esent\u003c/a\u003e the region into crisis. Of all the oil-rich countries that depend on the narrow maritime passageway for a large share of their hydrocarbon export routes, Iraq has been one of the most affected.\u003c/p\u003e\n\u003cp\u003ePrior to the Feb. 28 Israel-US strikes on Iran, Iraq exported approximately 3.3M barrels of oil per day production via Basra’s southern terminals. This is out of total production of 4.3M barrels per day. Lacking robust storage capacity, the events led Iraq to immediately cut production to around 1.5–2.0M barrels per day—enough to be consumed by Iraq’s domestic refineries.\u003c/p\u003e\n\u003cp\u003eWith approximately 90% of Iraq’s budget \u003ca href=\"../en/media-monitor/deep-dive-mounting-regional-confrontation-chokes-iraqs-energy-lifelines\" target=\"_blank\" rel=\"noopener\"\u003edependent\u003c/a\u003e on oil exports, the country is now facing severe fiscal pressure and vulnerability whether...\u003c/p\u003e29:T3edd,"])</script><script>self.__next_f.push([1,"\u003cp\u003eThe effective closure of the Strait of Hormuz amid the latest round of war between Iran, Israel and the United States has \u003ca href=\"../en/media-monitor/iraq-pivots-north-as-strait-of-hormuz-closure-forces-rethink-on-oil-flows\" target=\"_blank\" rel=\"noopener\"\u003esent\u003c/a\u003e the region into crisis. Of all the oil-rich countries that depend on the narrow maritime passageway for a large share of their hydrocarbon export routes, Iraq has been one of the most affected.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003ePrior to the Feb. 28 Israel-US strikes on Iran, Iraq exported approximately 3.3M barrels of oil per day via Basra’s southern terminals. This is out of a total of 4.3M barrels of crude Iraq pumped daily prior to the conflict. Lacking robust storage capacity, the events led Iraq to immediately cut production to around 1.5–2.0M barrels per day—enough to be consumed by Iraq’s domestic refineries.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eWith approximately 90% of Iraq’s budget \u003ca href=\"../en/media-monitor/deep-dive-mounting-regional-confrontation-chokes-iraqs-energy-lifelines\" target=\"_blank\" rel=\"noopener\"\u003edependent\u003c/a\u003e on oil exports, the country is now facing severe fiscal pressure and vulnerability whether or not a tenuous Iran-US \u003ca href=\"../en/media-monitor/will-the-iran-us-ceasefire-survive-israeli-escalation-in-lebanonn\" target=\"_blank\" rel=\"noopener\"\u003eceasefire\u003c/a\u003e holds. This reality has given a shot in the arm to pre-existing proposals to \u003ca href=\"https://www.thenationalnews.com/news/mena/2025/08/12/iraq-and-syria-discuss-revival-of-kirkukbaniyas-oil-pipeline/\" target=\"_blank\" rel=\"noopener\"\u003erenovate\u003c/a\u003e or rebuild Iraq’s long-shuttered Kirkuk-Baniyas pipeline.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThe crude conduit historically linked vast oil fields in Iraq’s north with ports on Syria’s Mediterranean coast. Closed since the 2003 US-led invasion of Iraq, the pipeline’s renewal remains one of the region’s most promising yet troubled energy infrastructure projects.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eWhile a nascent proposal was moving forward prior to Feb. 28, Iraq’s ongoing crude export crisis has breathed new life into the project. Advocates \u003ca href=\"https://www.mees.com/2026/1/30/news-in-brief/iraq-to-study-haditha-banias-oil-export-pipeline/1583c150-fde8-11f0-8f47-11af05c70bc6\" target=\"_blank\" rel=\"noopener\"\u003esuggest\u003c/a\u003e its swift completion, coming alongside other pipeline proposals, could be a boon for all involved. However, experts suggest that technical and security challenges will likely make Iraq’s export diversification dreams unviable in the short and medium term.\u0026nbsp;\u003c/p\u003e\n\u003cdiv style=\"text-align: center;\"\u003e\u003ciframe id=\"datawrapper-chart-IuMj5\" style=\"width: 0; min-width: 90% !important; border: none;\" title=\"Regional oil pipeline infrastructure\" src=\"https://datawrapper.dwcdn.net/IuMj5/4/\" height=\"478\" frameborder=\"0\" scrolling=\"no\" aria-label=\"Locator map\" data-external=\"1\"\u003e\u003c/iframe\u003e\u003c/div\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTechnical ecstasy\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eOpened in 1952 by the Iraq Petroleum Company, the path of the cross-border Kirkuk-Baniyas pipeline runs roughly 850 km (528 miles). The route reached its peak capacity in the early 1980s carrying\u003ca href=\"https://www.cia.gov/readingroom/document/cia-rdp97r00694r000600080001-6\" target=\"_blank\" rel=\"noopener\"\u003e approximately\u003c/a\u003e 400,000 barrels of crude oil per day. This was significantly lower than its initial maximum of 1.4M barrels per day, with regional tensions often leading to the line’s temporary closure.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThe most prolonged shutdown came when the Ba’athist government in Damascus \u003ca href=\"https://shafaq.com/en/Report/Kirkuk-Baniyas-Pipeline-Iraq-s-direct-oil-lifeline-to-the-Mediterranean\" target=\"_blank\" rel=\"noopener\"\u003eshuttered\u003c/a\u003e the pipeline in support of Tehran during the 1980-88 Iran-Iraq War. The closure is estimated to have cost Iraq’s economy billions of dollars at a critical wartime juncture.\u003c/p\u003e\n\u003cp\u003eThe pipeline was briefly reopened in 2000 after relations\u003ca href=\"https://www.newarab.com/analysis/history-iraq-syria-relations\" target=\"_blank\" rel=\"noopener\"\u003e between\u003c/a\u003e Syria and Iraq thawed over the 1990s, but closed again following the 2003 US-led invasion of Iraq. Subsequent rehabilitation proposals—such as a 2007\u003ca href=\"https://www.consultancy-me.com/news/12073/iraq-and-syria-hire-consultant-to-assess-revival-of-kirkuk-baniyas-oil-pipeline\" target=\"_blank\" rel=\"noopener\"\u003e initiative\u003c/a\u003e led by Russia’s state-owned Gazprom and another\u003ca href=\"https://www.gem.wiki/Basra%E2%80%93North_Baghdad%E2%80%93Syria_Oil_Pipeline\" target=\"_blank\" rel=\"noopener\"\u003e floated\u003c/a\u003e by Baghdad and Damascus in 2011—never materialized.\u003c/p\u003e\n\u003cp\u003eAll this changed when forces loyal to Syria’s current president, Ahmed Al-Sharaa, \u003ca href=\"https://www.timesofisrael.com/its-all-over-the-moment-iran-abandoned-assad-days-before-he-was-deposed/?__cf_chl_tk=RNJ6iT11OfBM_P3TVWcxw0IlHcQOEcCfHcDXpIwzx44-1770546468-1.0.1.1-siepZ1Q73HKq7Pw4cyEgbeLDwkSi4KZb3kh4u88OvIQ\" target=\"_blank\" rel=\"noopener\"\u003edeposed\u003c/a\u003e former president Bashar Al-Assad (2000-24) following a lightning Dec. 2024 offensive. The shift radically reordered Syria’s geopolitical dynamics, shifting Damascus away from the Tehran-led ‘Axis of Resistance’ regional alliance.\u003c/p\u003e\n\u003cdiv class=\"flourish-embed flourish-cards\" data-src=\"visualisation/20818310\"\u003e\u003c/div\u003e\n\u003cp\u003eWhile the dramatic shift put Iraq’s Iran-allied Shiite political\u003ca href=\"../en/media-monitor/iraqi-politicians-react-to-assad-s-fall-in-syria\" target=\"_blank\" rel=\"noopener\"\u003e factions\u003c/a\u003e on edge, caretaker Prime Minister Muhammad Shia’ Al-Sudani bucked their concerns by quickly opening diplomatic channels to Syria’s new rulers.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eSignaling the importance of the Iraq-Syria pipeline to these overtures, Iraqi National Intelligence Service (INIS) director Hamid Al-Shatri’s\u003ca href=\"../en/media-monitor/iraq-overhauls-mandate-of-spy-agency-amid-concerns-over-is\" target=\"_blank\" rel=\"noopener\"\u003e landmark\u003c/a\u003e Apr. 2025 meeting with Sharaa in Damascus reportedly included a discussion of the Kirkuk-Baniyas project.\u003c/p\u003e\n\u003cp\u003eThese discussions were followed up in Aug. 2025 during a\u003ca href=\"https://thenewregion.com/posts/2881/iraq-to-study-exporting-oil-through-syria-s-baniyas\" target=\"_blank\" rel=\"noopener\"\u003e meeting\u003c/a\u003e between Iraqi Oil Minister Hayan Abdul-Ghani and Syrian Energy Minister Mohammad Al-Bashir. This in turn led the two countries to\u003ca href=\"https://www.consultancy-me.com/news/12073/iraq-and-syria-hire-consultant-to-assess-revival-of-kirkuk-baniyas-oil-pipeline\" target=\"_blank\" rel=\"noopener\"\u003e appoint\u003c/a\u003e an international consulting firm to conduct a feasibility study, due to be completed within 6–12 months.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePipe dreams\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe proposal for a 700,000–1.5M barrels a day capacity pipeline to Baniyas now appears to have ditched the historical northern part of the line leading to Kirkuk. Instead, the project would now link up with several other \u003ca href=\"https://www.iraqinews.com/iraq/iraq-takes-steps-to-construct-basra-haditha-oil-pipeline/\" target=\"_blank\" rel=\"noopener\"\u003eproposed\u003c/a\u003e lines connecting at Haditha in Iraq’s Al-Anbar Governorate.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eAn already \u003ca href=\"https://www.newarab.com/news/iraq-approves-basra-haditha-pipeline-amid-regional-tensions#:~:text=Opposition%20and%20security%20concerns,s%20infrastructure%20development%20for%20decades.\" target=\"_blank\" rel=\"noopener\"\u003eapproved\u003c/a\u003e Basra-Haditha line due to be completed in 2028 is projected to \u003ca href=\"https://www.iraqinews.com/iraq/iraq-takes-steps-to-construct-basra-haditha-oil-pipeline/\" target=\"_blank\" rel=\"noopener\"\u003ecarry\u003c/a\u003e upwards of 2.25M barrels a day, and has been financed by a Chinese-Iraqi framework agreement \u003ca href=\"https://www.rudaw.net/english/middleeast/iraq/260420264\" target=\"_blank\" rel=\"noopener\"\u003esigned\u003c/a\u003e last year. A separate proposed pipeline \u003ca href=\"https://www.atlanticcouncil.org/blogs/menasource/amid-the-hormuz-crisis-an-iraq-jordan-egypt-oil-pipeline-can-no-longer-wait/\" target=\"_blank\" rel=\"noopener\"\u003erenewal\u003c/a\u003e project in its early stages of planning and development would tie Haditha to Jordan’s Red Sea port in Aqaba, and would carry approximately 1M barrels per day.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThe outbreak of the Iran-Israel-US regional conflict in February has put a renewed emphasis on these projects. If realized, the multidirectional pipelines stemming from Haditha could be a lifesaver for Baghdad. Such export diversification would allow large\u003ca href=\"https://thenewregion.com/posts/2881/iraq-to-study-exporting-oil-through-syria-s-baniyas\" target=\"_blank\" rel=\"noopener\"\u003e quantities\u003c/a\u003e of Basra-blend crude to be sent north rather than relying on increasingly\u003ca href=\"../en/article/why-iran-s-push-for-joint-sco-action-at-sea-may-hit-dead-end\" target=\"_blank\" rel=\"noopener\"\u003e vulnerable\u003c/a\u003e seaborne approaches in the Gulf.\u003c/p\u003e\n\u003cdiv class=\"flourish-embed flourish-chart\" data-src=\"visualisation/7648564\"\u003e\u003c/div\u003e\n\u003cp\u003eAn Apr. 26 \u003ca href=\"https://www.rudaw.net/english/middleeast/iraq/260420264\" target=\"_blank\" rel=\"noopener\"\u003estatement\u003c/a\u003e from Iraq’s Prime Minister’s Office backing the project said that the western pipelines linked to the Basra-Haditha line would “ensure flexibility in transporting [Iraq’s] crude oil.”\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eWhile these projects would undoubtedly diversify Iraq’s export portfolio, their near-term prospects remain stark. Syrian Deputy Minister of Oil Affairs Ghiath Diab\u003ca href=\"https://www.newarab.com/news/syria-iraq-planning-revive-kirkuk-baniyas-oil-pipeline\" target=\"_blank\" rel=\"noopener\"\u003e told\u003c/a\u003e Al-Araby Al-Jadeed in Nov. 2025 that successive conflicts in Iraq and Syria have destroyed most pumping stations along the original route of the Kirkuk-Baniyas line. Repairing the long inactive line along the existing route, or \u003ca href=\"https://www.worldpipelines.com/project-news/03082023/iraq-considers-rebuilding-pipeline-through-syria/\" target=\"_blank\" rel=\"noopener\"\u003erebuilding\u003c/a\u003e an entirely new western pipeline, would present a gargantuan technical challenge.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOn the back foot\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAdding to the project’s complexity are domestic disputes in Iraq. Officials in the semi-autonomous Kurdistan region may see the Haditha–Baniyas pipeline as undercutting their bargaining position vis-a-vis the federal government. Baghdad and Erbil have long \u003ca href=\"../en/media-monitor/iraqi-kurdistan-faces-end-of-era-as-ability-to-export-oil-independently-threatene\" target=\"_blank\" rel=\"noopener\"\u003esparred\u003c/a\u003e over the northern Kirkuk–Ceyhan pipeline, which transfers crude tapped in the autonomous region to Turkiye’s southern coast for export.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eAnkara closed the pipeline in Mar. 2023 after an international \u003ca href=\"../en/media-monitor/iraqi-kurdistan-faces-end-of-era-as-ability-to-export-oil-independently-threatene\" target=\"_blank\" rel=\"noopener\"\u003earbitration\u003c/a\u003e court sided with Baghdad’s \u003ca href=\"../en/media-monitor/officials-hail-iraq-turkey-oil-for-water-accord-as-critics-cry-foul\" target=\"_blank\" rel=\"noopener\"\u003eclaim\u003c/a\u003e that Erbil’s independent oil sales violated prior agreements. In its ruling, the court found Turkiye liable for 1.5B USD in damages.\u003c/p\u003e\n\u003cp\u003eThe route was only reopened in Sept. 2025 after a tenuous\u003ca href=\"../en/media-monitor/fragile-accord-sees-resumption-of-iraqi-kurdistan-s-oil-exports\" target=\"_blank\" rel=\"noopener\"\u003e settlement\u003c/a\u003e saw the semi-autonomous region’s crude sales put under the exclusive control of Iraq's national State Oil Marketing Organization. However, contention over the pipeline has continued.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eIn March, Erbil \u003ca href=\"../en/media-monitor/iraq-pivots-north-as-strait-of-hormuz-closure-forces-rethink-on-oil-flows\" target=\"_blank\" rel=\"noopener\"\u003erefused\u003c/a\u003e to allow federal Iraq’s crude to flow through the northern pipeline as an alternative to Iraq’s blocked southern seaborne exports. While the issue was eventually resolved, the dispute was a stark reminder that in Iraq lingering and unresolved conflicts can quickly magnify emerging crises.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eMohammed A. Salih, a non-resident senior fellow at the US-based Foreign Policy Research Institute, told Amwaj.media that any alternative westbound export route would “reduce the importance of the Kirkuk-Ceyhan pipeline for Baghdad.” He added that more diversified export routes could potentially tip any future negotiations with Erbil over profit sharing or other issues even further in the federal government’s favour.\u003c/p\u003e\n\u003cdiv style=\"text-align: center;\"\u003e\u003ciframe id=\"datawrapper-chart-mM4JE\" style=\"width: 0; min-width: 90% !important; border: none;\" title=\"Independent oil exports from Iraqi Kurdistan\" src=\"https://datawrapper.dwcdn.net/mM4JE/1/\" height=\"631\" frameborder=\"0\" scrolling=\"no\" aria-label=\"Locator maps\" data-external=\"1\"\u003e\u003c/iframe\u003e\u003c/div\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eBy contrast, author of the Musings on Iraq blog Joel Wing is skeptical that Baghdad’s diversification plans are guided by its often adversarial relationship with Erbil. He suggested in comments to Amwaj.media that federal authorities do not have “that kind of strategic planning.”\u003c/p\u003e\n\u003cp\u003eWing also argued that the Kurdistan Regional Government (KRG) has already found itself “completely dependent upon monthly budget payments” from the central government to cover its finances. Given this reality, it is difficult to imagine a reshaped energy dynamic in Iraq reducing Erbil’s bargaining position even further.\u003c/p\u003e\n\u003cp\u003eAt the same time, the longer-term horizon for these projects will do little to address Iraq’s reliance on the Strait of Hormuz in the short term. Despite a lull in the conflict following an Apr. 8 Iran-US ceasefire, Iraq’s southern exports remain severely constrained. Recent reports suggest Iraq is only back to a fraction of its pre-war production.\u003c/p\u003e\n\u003cp\u003eThe recent \u003ca href=\"https://www.dailysabah.com/business/energy/iraq-plans-pipeline-revamp-for-direct-kirkuk-oil-exports-to-turkiye\" target=\"_blank\" rel=\"noopener\"\u003erenovation\u003c/a\u003e of a separate federally run Kirkuk-Ceyhan pipeline bypassing Iraqi Kurdistan is \u003ca href=\"https://www.rudaw.net/english/middleeast/iraq/01052026\" target=\"_blank\" rel=\"noopener\"\u003ereportedly\u003c/a\u003e close to completion. However, its \u003ca href=\"https://www.thenationalnews.com/business/energy/2026/03/16/iraq-works-to-revive-kirkuk-ceyhan-pipeline-as-southern-exports-halt/\" target=\"_blank\" rel=\"noopener\"\u003ecapacity\u003c/a\u003e is only projected at 250,000 to 330,000 barrels per day—a drop in the bucket when considered next to Iraq’s pre-war export volume of roughly 3.3M barrels per day.\u003c/p\u003e\n\u003cdiv class=\"newsletterembed\"\u003e\u003c/div\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eGo with the flow\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAs it stands, any western pipeline project in Iraq transiting Syria or Jordan remains a long shot. Through March and April, US airstrikes have targeted bases and positions of Iran-backed brigades in Iraq’s Popular Mobilization Units (PMU) across Iraq’s western frontier.\u003c/p\u003e\n\u003cp\u003eSalih noted that such security conditions in Iraq, and particularly in Anbar, “do not inspire a great deal of confidence” for the success of any major infrastructure project. Some analysts have suggested that these strikes \u003ca href=\"https://x.com/LawkGhafuri/status/2036742657502773710\" target=\"_blank\" rel=\"noopener\"\u003eindicate\u003c/a\u003e Washington is actively seeking to uproot Iran-backed armed factions from the governorate.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eWhile such an outcome could create favourable security conditions necessary to make any western pipeline viable, Salih reckoned that the prospect of a PMU withdrawal from Iraq’s west was \"unlikely.\" Such groups will likely remain in the governorate, he said, due to its “highly strategic location” controlling trade routes to Jordan and Syria.\u003c/p\u003e\n\u003cp\u003eThe analyst added that the future of any pipeline project in Anbar “will depend on Iraq’s circumstances after [the Iran-Israel-US] war and its internal stability, or lack thereof.” On the other hand, Wing was more pessimistic, saying that the proposals were “pure fantasy.”\u003c/p\u003e\n\u003cdiv class=\"tipsembed\"\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"2a:T9df,"])</script><script>self.__next_f.push([1,"\u003cul\u003e\n\u003cli\u003eThe effective \u003ca href=\"../en/media-monitor/iraq-pivots-north-as-strait-of-hormuz-closure-forces-rethink-on-oil-flows\" target=\"_blank\" rel=\"noopener\"\u003eclosure\u003c/a\u003e of the Strait of Hormuz, Iraq’s principal oil export route, amid the Iran-Israel-US war has renewed pre-existing efforts to diversify Iraq’s overland oil exports. One pipeline proposal would link Iraq’s southern oil fields to Syria’s Mediterranean Baniyas port and carry between 700,000 to 1.5M barrels of oil per day.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eThe pipeline was initially planned to run along the same route as the derelict Kirkuk-Baniyas pipeline. Officials are now focused on a new plan that would link Syria’s Baniyas port to a transit station at Haditha in Al-Anbar Governorate. This would tie in with another planned project \u003ca href=\"https://www.rudaw.net/english/middleeast/iraq/260420264\" target=\"_blank\" rel=\"noopener\"\u003elinking\u003c/a\u003e the Haditha station with Basra’s massive oil fields. The latter project is due to be completed in 2028.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eThese crude transit projects would \u003ca href=\"https://thenewregion.com/posts/2881/iraq-to-study-exporting-oil-through-syria-s-baniyas\" target=\"_blank\" rel=\"noopener\"\u003eenable\u003c/a\u003e Basra-blend crude pumped in Iraq’s south to flow north and west and avoid the \u003ca href=\"../en/article/why-iran-s-push-for-joint-sco-action-at-sea-may-hit-dead-end\" target=\"_blank\" rel=\"noopener\"\u003eunstable\u003c/a\u003e southern seaborne export routes. A separate proposal still in its early \u003ca href=\"https://www.atlanticcouncil.org/blogs/menasource/amid-the-hormuz-crisis-an-iraq-jordan-egypt-oil-pipeline-can-no-longer-wait/\" target=\"_blank\" rel=\"noopener\"\u003estages\u003c/a\u003e would see Basra crude piped to Haditha to then onto Jordan’s Red Sea port at Aqaba.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eBaghdad is keen on \u003ca href=\"https://www.jpost.com/middle-east/article-882524\" target=\"_blank\" rel=\"noopener\"\u003epushing\u003c/a\u003e these pipeline plans forward. However, energy experts remain skeptical of their viability due to technical challenges in addition to the region's unstable security dynamic.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eOngoing US airstrikes in Anbar on Iran-allied Shiite armed groups have \u003ca href=\"../en/media-monitor/baghdads-new-self-defense-mandate-may-formalize-regionalization-of-iran-war\" target=\"_blank\" rel=\"noopener\"\u003ehighlighted\u003c/a\u003e these pipeline projects’ vulnerability. As it stands, so long as Iraq’s western frontier remains a battlezone any planned pipeline linking Iraq to its western neighbors remains fraught with challenges.\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"$L26\",null,{\"langRoutes\":{\"en\":true,\"ar\":true,\"fa\":true}}],[\"$\",\"$L27\",null,{\"article\":{\"id\":\"H_BphrrdSQijQd5YKPCBSw\",\"slug\":\"iraqs-western-pipeline-gambit-faces-a-wall-of-risk-amid-export-crisis\",\"title\":\"Iraq’s western pipeline gambit faces a wall of risk amid export crisis\",\"subtitle\":\"\",\"newsBreadcrumb\":\"$28\",\"deepRead\":\"$29\",\"bottomLine\":\"$2a\",\"category\":{\"name\":\"Economy\",\"slug\":\"economy\"},\"region\":{\"name\":\"Iraq\",\"slug\":\"iraq\"},\"author\":[{\"id\":\"QhfqQiAgRmaDr0DDv8hAIA\",\"type\":\"employee\",\"name\":\"Paul Iddon\",\"profileText\":\"\u003cp\u003ePaul Iddon is a freelance writer and journalist who writes regularly and extensively about the conflicts, military affairs, geopolitics, and history of the Middle East. He has had several hundred analysis pieces on regional developments published in various regional and international media outlets over the past decade.\u003c/p\u003e\\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\",\"bylineImage\":{\"responsiveImage\":{\"src\":\"https://www.datocms-assets.com/36798/1750627456-paul-iddon-headshot.png\"},\"alt\":\"Paul Iddon\",\"title\":\"Paul Iddon\",\"focalPoint\":{\"x\":0.5,\"y\":0.5}}}],\"tag\":[{\"id\":\"23765076\",\"name\":\"Syria\",\"enName\":\"Syria\"},{\"id\":\"92991169\",\"name\":\"Kirkuk\",\"enName\":\"Kirkuk\"},{\"id\":\"22935472\",\"name\":\"Oil\",\"enName\":\"Oil\"},{\"id\":\"19500879\",\"name\":\"PMU\",\"enName\":\"PMU\"}],\"featuredImages\":[{\"thumb\":\"https://www.datocms-assets.com/36798/1646150699-gettyimages-463844782.jpg?crop=focalpoint\u0026fit=crop\u0026fp-x=0.25\u0026fp-y=0.46\u0026h=256\u0026w=256\",\"video\":null,\"full\":\"https://www.datocms-assets.com/36798/1646150699-gettyimages-463844782.jpg?crop=focalpoint\u0026fit=crop\u0026fp-x=0.25\u0026fp-y=0.46\u0026h=478\u0026w=850\",\"alt\":\"Workers from the South Oil Company watch on as a pipeline ejects oil in Basra, Iraq on Feb. 19, 2015. (Photo via Getty Images)\",\"title\":\"Workers from the South Oil Company watch on as a pipeline ejects oil in Basra, Iraq on Feb. 19, 2015. (Photo via Getty Images)\"}],\"thumbnailOverride\":null,\"useThumbnailAsVideoSplash\":false,\"firstPublishedAt\":\"2026-05-01T17:43:55+01:00\",\"_publishedAt\":\"2026-05-05T11:50:14+01:00\",\"locales\":[{\"locale\":\"ar\",\"value\":true},{\"locale\":\"en\",\"value\":true},{\"locale\":\"fa\",\"value\":true}]},\"latestTeasers\":[{\"id\":\"YaYvougnRXiKyzrrYSK6qQ\",\"type\":\"article\",\"title\":\"Deep Dive: The UAE’s exit from the world’s biggest cartel\",\"slug\":\"deep-dive-the-uaes-exit-from-the-worlds-biggest-cartel\",\"firstPublishedAt\":\"2026-05-12T14:32:17+01:00\",\"region\":{\"id\":\"10585890\",\"name\":\"Peninsula\"},\"category\":{\"id\":\"9629668\",\"name\":\"Economy\"},\"authors\":[{\"id\":\"29788381\",\"name\":\"Nikolay Kozhanov\",\"bylineImage\":\"https://www.datocms-assets.com/36798/1617915089-nikolaykozhanovcrop-1.jpg?crop=focalpoint\u0026fit=crop\u0026w=32\u0026ar=1%3A1\u0026fp-x=0.50\u0026fp-y=0.50\"},{\"id\":\"Dfz-ifldSw6STBKMxCUxMg\",\"name\":\" Saban Kardas\",\"bylineImage\":\"https://www.datocms-assets.com/36798/1738150581-kardas.jpg?crop=focalpoint\u0026fit=crop\u0026w=32\u0026ar=1%3A1\u0026fp-x=0.50\u0026fp-y=0.50\"}],\"featuredImage\":{\"src\":\"https://www.datocms-assets.com/36798/1738710405-gettyimages-1431040445.jpg\",\"focalPoint\":{\"x\":0.5,\"y\":0.5},\"canTransform\":true}},{\"id\":\"QSNgDQ4PTeCX-Vkj3D3hgw\",\"type\":\"article\",\"title\":\"Amid war over its skies, Baghdad plays the field for new fighter jets\",\"slug\":\"baghdad-plays-the-field-for-new-fighter-jets-amid-regional-aerial-warfare\",\"firstPublishedAt\":\"2026-05-11T22:44:10+01:00\",\"region\":{\"id\":\"10585886\",\"name\":\"Iraq\"},\"category\":{\"id\":\"10585896\",\"name\":\"Security\"},\"authors\":[{\"id\":\"QhfqQiAgRmaDr0DDv8hAIA\",\"name\":\"Paul Iddon\",\"bylineImage\":\"https://www.datocms-assets.com/36798/1750627456-paul-iddon-headshot.png?crop=focalpoint\u0026fit=crop\u0026w=32\u0026ar=1%3A1\u0026fp-x=0.50\u0026fp-y=0.50\"}],\"featuredImage\":{\"src\":\"https://www.datocms-assets.com/36798/1778534509-iraqi-f16s.png\",\"focalPoint\":{\"x\":0.5,\"y\":0.5},\"canTransform\":true}},{\"id\":\"KDq0d1yRQa2llANgHI1f6g\",\"type\":\"media_monitor\",\"title\":\"IRGC media float plan to levy fees for subsea Internet cables\",\"slug\":\"irgc-media-floats-plan-to-levy-fees-for-subsea-internet-cables\",\"firstPublishedAt\":\"2026-05-11T04:02:06+01:00\",\"region\":{\"id\":\"10585888\",\"name\":\"Iran\"},\"category\":{\"id\":\"10585896\",\"name\":\"Security\"},\"authors\":[{\"id\":\"11257816\",\"name\":\"Amwaj.media\",\"bylineImage\":\"https://www.datocms-assets.com/36798/1680731398-icon-for-twitter-fb-ig-linkedin.png?crop=focalpoint\u0026fit=crop\u0026w=32\u0026ar=1%3A1\u0026fp-x=0.50\u0026fp-y=0.50\"}],\"featuredImage\":{\"src\":\"https://www.datocms-assets.com/36798/1778467958-gemini_generated_image_gted1dgted1dgted-edited.png\",\"focalPoint\":{\"x\":0.5,\"y\":0.5},\"canTransform\":true}},{\"id\":\"WI8sIsZoQ3OQUr9HQC8S_w\",\"type\":\"article\",\"title\":\"What has China done to protect Iranian-Saudi rapprochement?\",\"slug\":\"what-has-china-done-to-protect-iranian-saudi-rapprochement\",\"firstPublishedAt\":\"2026-05-11T01:16:42+01:00\",\"region\":{\"id\":\"10585890\",\"name\":\"Peninsula\"},\"category\":{\"id\":\"10585904\",\"name\":\"Diplomacy\"},\"authors\":[{\"id\":\"GqbeHyg8Re-GIm-1S8YBOQ\",\"name\":\"Yang Xiaotong\",\"bylineImage\":\"https://www.datocms-assets.com/36798/1732621330-20241126113436.jpg?crop=focalpoint\u0026fit=crop\u0026w=32\u0026ar=1%3A1\u0026fp-x=0.50\u0026fp-y=0.50\"}],\"featuredImage\":{\"src\":\"https://www.datocms-assets.com/36798/1778457331-gemini_generated_image_2o9ocq2o9ocq2o9o-1.png\",\"focalPoint\":{\"x\":0.5,\"y\":0.5},\"canTransform\":true}}]}]]\n"])</script><next-route-announcer style="position: absolute;"></next-route-announcer></body></html>
